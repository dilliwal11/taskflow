server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Reverse proxy: the browser only ever talks to this origin, so no CORS is needed in production.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Single-page app fallback: unknown paths such as /teams/3 return index.html,
    # and the Angular router takes over in the browser.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # File names contain a content hash, so they can be cached for a long time.
    location ~* \.(js|css)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
