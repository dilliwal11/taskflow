spring:
  application:
    name: taskflow-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/taskflow}
    username: ${SPRING_DATASOURCE_USERNAME:taskflow}
    password: ${SPRING_DATASOURCE_PASSWORD:taskflow}
  jpa:
    # Flyway owns the schema. Hibernate only checks that entities match it.
    hibernate:
      ddl-auto: validate
    # Lazy loading stops at the service layer, so controllers only ever see DTOs.
    open-in-view: false
  flyway:
    enabled: true
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health
  health:
    mail:
      enabled: false

app:
  jwt:
    # HS256 needs at least 32 bytes. Always override this outside local dev.
    secret: ${JWT_SECRET:dev-only-secret-change-me-please-at-least-32-bytes}
    expiry-minutes: 60
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  mail:
    # false = log emails to the console, true = send through SMTP (Mailpit in docker-compose)
    enabled: ${MAIL_ENABLED:false}
    from: no-reply@taskflow.local
  notifications:
    poll-interval-ms: 5000
